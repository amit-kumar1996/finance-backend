server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.example.com;

    ssl_certificate     /etc/ssl/cloudflare/pfm-origin.crt;
    ssl_certificate_key /etc/ssl/cloudflare/pfm-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PFM_TLS:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/pfm-api.access.log;
    error_log  /var/log/nginx/pfm-api.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
