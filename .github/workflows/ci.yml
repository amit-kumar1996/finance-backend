name: Backend CI

on:
  push:
    branches: [main, phase-1-foundation]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.7
        env:
          MYSQL_DATABASE: personal_finance
          MYSQL_USER: pfm
          MYSQL_PASSWORD: pfm-local-only
          MYSQL_ROOT_PASSWORD: local-root-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -upfm -ppfm-local-only --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      DATABASE_URL: mysql://pfm:pfm-local-only@127.0.0.1:3306/personal_finance
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run db:deploy
      - run: npm test
      - run: npm run build
