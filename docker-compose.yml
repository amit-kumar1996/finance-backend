services:
  mysql:
    image: mysql:8.4.7
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: personal_finance
      MYSQL_USER: pfm
      MYSQL_PASSWORD: pfm-local-only
      MYSQL_ROOT_PASSWORD: local-root-only
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -upfm -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  mysql-data:
